# Postly — n8n single mode + Caddy (auto-TLS). Basado en .claude/skills/n8n-self-hosting.
# Desvios deliberados respecto de la plantilla: env access habilitado, builtins
# crypto/fs/child_process, ffmpeg estatico montado (HU13) y variables propias de Postly.
services:
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - N8N_SUBDOMAIN=${SUBDOMAIN}
      - N8N_DOMAIN=${DOMAIN_NAME}
    volumes:
      - caddy_data:/data
      - caddy_config:/config
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - n8n
    networks:
      - n8n_net

  n8n:
    image: docker.n8n.io/n8nio/n8n:${N8N_IMAGE_TAG}
    restart: unless-stopped
    environment:
      - N8N_HOST=${SUBDOMAIN}.${DOMAIN_NAME}
      - N8N_PORT=5678
      - N8N_PROTOCOL=https
      - N8N_EDITOR_BASE_URL=https://${SUBDOMAIN}.${DOMAIN_NAME}/
      - WEBHOOK_URL=https://${SUBDOMAIN}.${DOMAIN_NAME}/
      - N8N_PROXY_HOPS=1
      - GENERIC_TIMEZONE=${GENERIC_TIMEZONE}
      - TZ=${GENERIC_TIMEZONE}
      - NODE_ENV=production
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
      - N8N_SECURE_COOKIE=true
      - N8N_DIAGNOSTICS_ENABLED=false
      - N8N_PERSONALIZATION_ENABLED=false
      - N8N_HIRING_BANNER_ENABLED=false
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
      - NODE_FUNCTION_ALLOW_BUILTIN=crypto,fs,child_process
      - N8N_RUNNERS_ENABLED=true
      # FFmpeg (HU13) corre bloqueante en un Code node: con video 1080p en 2 vCPU tarda mas de 30 s
      - N8N_RUNNERS_HEARTBEAT_INTERVAL=180
      - N8N_DEFAULT_BINARY_DATA_MODE=filesystem
      - EXECUTIONS_DATA_PRUNE=true
      - EXECUTIONS_DATA_MAX_AGE=336
      - EXECUTIONS_DATA_PRUNE_MAX_COUNT=50000
      # --- Postly ---
      - POSTLY_ENC_KEY=${POSTLY_ENC_KEY}
      - META_ACCESS_TOKEN=${META_ACCESS_TOKEN}
      - META_APP_ID=${META_APP_ID}
      - META_APP_SECRET=${META_APP_SECRET}
      - META_CONFIG_ID=${META_CONFIG_ID}
      - META_PAGE_ID=${META_PAGE_ID}
      - IG_BUSINESS_ID=${IG_BUSINESS_ID}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET}
    volumes:
      - n8n_data:/home/node/.n8n
      - ./local_files:/files
      - /usr/local/bin/ffmpeg:/usr/local/bin/ffmpeg:ro
    networks:
      - n8n_net

volumes:
  n8n_data:
    name: n8n_data
  caddy_data:
    name: caddy_data
  caddy_config:
    name: caddy_config

networks:
  n8n_net:
    driver: bridge
